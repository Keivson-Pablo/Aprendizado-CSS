<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-classes e Pseudo-elementos - Práticas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header class="topo">
    <h1 class="titulo">Pseudo-classes, Pseudo-elementos e Eventos Visuais</h1>
  </header>

  <main class="conteudo">

    <!-- PRÁTICA 1: MENU DE NAVEGAÇÃO -->
    <section class="pratica">
      <h2>Prática 1: Menu de Navegação</h2>
      <nav>
        <ul class="menu">
          <li><a href="#">Home</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Serviços</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
    </section>

    <!-- PRÁTICA 2: TABELA ZEBRA -->
    <section class="pratica">
      <h2>Prática 2: Tabela Zebra</h2>
      <div class="tabela-wrapper">
        <table class="tabela-alunos">
          <tr><th>Nome</th><th>Nota</th></tr>
          <tr><td>João</td><td>8.5</td></tr>
          <tr><td>Maria</td><td>9.0</td></tr>
          <tr><td>Pedro</td><td>7.0</td></tr>
          <tr><td>Ana</td><td>10.0</td></tr>
        </table>
      </div>
    </section>

    <!-- PRÁTICA 3: CARDS COM ::before -->
    <section class="pratica">
      <h2>Prática 3: Cards com ::before</h2>
      <div class="cards">
        <div class="card">
          <h3>Tênis de Corrida</h3>
          <p>R$ 299,00</p>
        </div>
        <div class="card novo">
          <h3>Camiseta Esportiva</h3>
          <p>R$ 99,00</p>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
